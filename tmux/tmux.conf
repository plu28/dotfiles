# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

# Better colors
set-option -sa terminal-overrides ",xterm*:Tc"

# Status line plugins
set -g @plugin 'binoymanoj/tmux-minimal-theme'
set -g @plugin "soyuka/tmux-current-pane-hostname"


# Status Line customization

# Tokyo Night color theme for status line
set -g @minimal_theme_bg_color "#222436" # #222436 <-- moon #1A1B26 
set -g @minimal_theme_active_color "#7aa2f7"
set -g @minimal_theme_inactive_color "#565f89"
set -g @minimal_theme_text_color "#c0caf5"
set -g @minimal_theme_accent_color "#7aa2f7"
set -g @minimal_theme_border_color "#414868"

# Override the theme's right-side widgets with higher-signal session state.

# Set the background color of the status line
# set -g status-bg "#909FB5"
# set -g status-fg colour0

# Change the left and right status style
# set -g status-left "#[fg=colour0,bg=#909FB5] #S #[default]"
# set -g status-right "#[fg=colour0,bg=#909FB5] %Y-%m-%d %H:%M #[default]"
# set -g focus-events on
# set -g status-style bg=default
# set -g status-left-length 90
# set -g status-right-length 90
# set -g status-justify left

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Opens new panes from current path
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"


# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Unbind the default prefix key
unbind C-b

# Set Ctrl-Space as the new prefix key
set-option -g prefix C-Space
bind C-Space send-prefix

# opens tms 
bind t display-popup -E "tms"

# set vi-mode
set-window-option -g mode-keys vi

# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-k send-keys -X halfpage-up \; send-keys -X scroll-middle
bind-key -T copy-mode-vi C-j send-keys -X halfpage-down \; send-keys -X scroll-middle

bind-key -n C-s run-shell "selected_dir=\$(fd . ~/Code -t d | fzf --tmux 80%); if [ -n \"\$selected_dir\" ]; then tmux new-window -c \"\$selected_dir\"; fi"
# bind-key -n C-s run-shell "eval \"tmux new-window -c \$(fd . ~/Code -t d | fzf --tmux 80%)\""
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# e pushes a task onto the persistent task stack
bind-key e command-prompt -p "Push task:" "run-shell -b '/Users/david/.config/tmux/scripts/task-stack --session #{q:session_name} push \"%%%\"'"

# v pops the current task and returns to the previous one
bind-key v run-shell -b '/Users/david/.config/tmux/scripts/task-stack --session #{q:session_name} pop'

# V clears the entire persistent task stack
bind-key V run-shell -b '/Users/david/.config/tmux/scripts/task-stack --session #{q:session_name} clear'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

